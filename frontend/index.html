<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Sistema de Nómina</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login-view" class="view active" aria-labelledby="login-title">
    <main class="login-card">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">$$$</span>
        <h1 id="login-title">Nómina</h1>
        <p class="subtitle">Sistema de Gestión</p>
      </div>

      <form id="login-form">
        <div class="input-group">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" placeholder="Ej: admin"
            maxlength="100" autocomplete="username" required>
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="••••••••"
            maxlength="200" autocomplete="current-password" required>
        </div>
        <button id="login-submit" type="submit" class="btn-primary">Iniciar sesión</button>
      </form>

      <p id="login-error" class="error-message" role="alert" aria-live="polite"></p>
      <div class="connection-row">
        <p id="connection-status" class="connection-status" role="status" aria-live="polite">
          Conectando con el servidor…
        </p>
        <button id="retry-btn" class="text-button" type="button" hidden>Reintentar</button>
      </div>
    </main>
  </section>

  <section id="app-view" class="view" aria-label="Panel de usuario">
    <header class="app-header">
      <div class="header-left">
        <span class="logo-icon-small" aria-hidden="true">$$$</span>
        <h2>Nómina</h2>
      </div>
      <div class="header-right">
        <span id="user-display" class="user-name"></span>
        <button id="logout-btn" class="btn-secondary" type="button">Cerrar sesión</button>
      </div>
    </header>

    <main class="app-content">
      <section class="welcome-card">
        <h3>Bienvenido, <span id="welcome-name"></span></h3>
        <p>Selecciona un perfil para continuar</p>
      </section>

      <section aria-label="Perfiles disponibles">
        <div id="profiles-container" class="profiles-grid"></div>
        <p id="profile-selection" class="profile-selection" aria-live="polite"></p>
      </section>

      <section class="session-info" aria-label="Información de sesión">
        <p><strong>Sesión válida hasta:</strong> <span id="expires-display"></span></p>
        <p id="app-connection-status" class="connection-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
