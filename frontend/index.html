<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Nómina</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login-view" class="view active">
    <main class="login-card">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">$$$</span>
        <h1>Nómina</h1>
        <p class="subtitle">Sistema de Gestión</p>
      </div>

      <form id="login-form" novalidate>
        <div class="input-group">
          <label for="username">Usuario</label>
          <input id="username" type="text" placeholder="Ej: admin" autocomplete="username">
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button id="login-submit" type="submit" class="btn-primary">Iniciar sesión</button>
      </form>

      <p id="login-error" class="error-message" role="alert"></p>
    </main>
  </section>

  <section id="app-view" class="view">
    <header class="app-header">
      <div class="header-left">
        <span class="logo-icon-small" aria-hidden="true">$$$</span>
        <h2>Nómina</h2>
      </div>
      <div class="header-right">
        <span id="user-display" class="user-name"></span>
        <button id="logout-btn" class="btn-secondary" type="button">Cerrar sesión</button>
      </div>
    </header>

    <main class="app-content">
      <section class="welcome-card">
        <h3>Bienvenido, <span id="welcome-name"></span></h3>
        <p>Perfiles asignados a tu usuario</p>
      </section>

      <div id="profiles-container" class="profiles-grid"></div>

      <section class="session-info">
        <p><strong>ID de usuario:</strong> <span id="userid-display"></span></p>
        <p><strong>Sesión válida hasta:</strong> <span id="expires-display"></span></p>
      </section>

      <section class="session-info">
        <h3>Prueba de seguridad: nomina / Empresa</h3>
        <button id="listar-btn" class="btn-secondary" type="button">Listar empresas</button>
        <div class="input-group">
          <label for="empresa-nombre">Nombre</label>
          <input id="empresa-nombre" type="text" placeholder="Ej: Empresa Nueva C.A.">
        </div>
        <div class="input-group">
          <label for="empresa-rif">RIF</label>
          <input id="empresa-rif" type="text" placeholder="Ej: J-12345678-9">
        </div>
        <button id="crear-btn" class="btn-secondary" type="button">Crear empresa</button>
        <pre id="process-result"></pre>
      </section>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
